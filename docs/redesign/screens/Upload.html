<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add new recipe</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>body{margin:0;background:#E9E9E9;display:flex;justify-content:center;padding:24px}.s{border-radius:44px;box-shadow:0 20px 50px rgba(0,0,0,.15)}</style>
</head>
<body><div class="s" style="width: 390px; height: 844px">
<header class="top"><a class="ib" href="Create.html" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a><h1 class="tt">New Recipe</h1><span style="width:46px"></span></header>
<div class="body" style="gap:14px">
<div class="pc" style="height:180px"><img src="../../../.redesign-assets/gnocchi.jpg" alt="Recipe photo preview"><div class="tl"><span class="tag glk lg">Cover photo</span></div><div class="ov" style="right:14px;bottom:14px"><button class="ib gl" aria-label="Choose from gallery"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"></rect><path d="M4 16l4-4 4 4 3-3 5 5"></path><circle cx="9" cy="10" r="1.5"></circle></svg></button><button class="ib gl" aria-label="Take photo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button></div></div>
<div class="fld"><label for="ti">Recipe Title</label><input id="ti" type="text" placeholder="e.g., Grandma’s Sunday roast"></div>
<div class="fld"><label for="de">Description</label><textarea id="de" placeholder="Describe your recipe..."></textarea></div>
<div class="g3"><div class="fld"><label for="pt">Prep (min)</label><input id="pt" type="text" inputmode="numeric" placeholder="10"></div><div class="fld"><label for="ct">Cook (min)</label><input id="ct" type="text" inputmode="numeric" placeholder="20"></div><div class="fld"><label for="sv">Servings</label><input id="sv" type="text" inputmode="numeric" placeholder="4"></div></div>
<div class="row sb"><h2 class="h2">Ingredients</h2><button class="lnk row" style="gap:4px;height:44px;color:#0F0F0F"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg> Add</button></div>
<div class="rows box"><div><b style="width:56px">2 tbsp</b><span class="grow">Olive oil</span><button aria-label="Remove ingredient" class="ic w" style="width:34px;height:34px"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></div>
</div>
<div class="cta fd"><button class="btn o">Upload Recipe</button></div>
</div></body>
</html>
