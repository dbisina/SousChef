<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weight loss journey</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>body{margin:0;background:#E9E9E9;display:flex;justify-content:center;padding:24px}.s{border-radius:44px;box-shadow:0 20px 50px rgba(0,0,0,.15)}</style>
</head>
<body><div class="s" style="width: 390px; height: 844px">
<header class="top"><a class="ib" href="Profile.html" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><h1 class="tt">Weight Goals</h1><span style="width:44px"></span></header>
<div class="body" style="gap:16px">
<div class="card k col" style="gap:12px;border-radius:30px;padding:20px"><div class="row sb"><span class="sec" style="color:#A3A3A3">Daily target</span><span class="tag" style="background:#262626;color:#fff">−500 cal</span></div><b class="d" style="font-size:48px;font-weight:500;line-height:1;letter-spacing:-.03em">1,650 <span style="font-size:16px;color:#A3A3A3">cal</span></b><div class="bar"><i style="width:77%"></i></div><span class="sm" style="color:#A3A3A3">Estimated TDEE 2,150 · ~1 lb a week</span></div>
<div class="g2"><div class="fld"><label for="cw">Current weight</label><input id="cw" type="text" inputmode="decimal" placeholder="[YOUR WEIGHT]"></div><div class="fld"><label for="tw">Target weight</label><input id="tw" type="text" inputmode="decimal" placeholder="[YOUR TARGET]"></div></div>
<div class="col" style="gap:10px"><div class="row sb"><b class="t">Activity level</b><div class="seg" style="width:116px"><button class="on" style="height:34px">lbs</button><button style="height:34px">kg</button></div></div><div class="chips" style="margin-right:-20px"><button class="chip">Sedentary</button><button class="chip">Light</button><button class="chip on">Moderate</button><button class="chip">Active</button></div></div>
<div class="col" style="gap:10px"><b class="t">Weekly pace</b><div class="g3"><button class="tile"><b style="font-size:17px">250</b><span>~0.5 lb</span></button><button class="tile on"><b style="font-size:17px">500</b><span>~1 lb</span></button><button class="tile"><b style="font-size:17px">750</b><span>~1.5 lb</span></button></div></div>
</div>
<div class="cta"><a class="btn o" href="Profile.html">Save Goals</a></div>
</div></body>
</html>
