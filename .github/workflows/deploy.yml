name: deploy

# Builds the server images and puts them live on the server. Run by hand from the Actions tab
# (pick a branch or tag), or by pushing a tag that starts with "server-v".
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST      the server's address
#   DEPLOY_USER      the account that owns /opt/souschef (not root)
#   DEPLOY_SSH_KEY   a private key whose public half is in that account's authorized_keys
#   DEPLOY_KNOWN_HOSTS   the output of `ssh-keyscan -t ed25519 <host>`, so the host is checked, not trusted blindly
# Images go to GitHub's container registry using the workflow's own token. The server pulls them with a read-only token
# saved there once by `docker login ghcr.io`.

on:
  workflow_dispatch:
  push:
    tags: ["server-v*"]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/souschef-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: tag
        run: echo "value=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runtime stage holds the compiled app; the migrate stage holds the tools that apply database migrations.
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: migrate
          push: true
          tags: ${{ env.IMAGE }}-migrate:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=api

      - name: Copy the deploy files to the server
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          scp -i ~/.ssh/id_deploy deploy/docker-compose.prod.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh deploy/restore-test.sh deploy/cloudflare-firewall.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/souschef/"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/souschef && chmod +x *.sh && ./deploy.sh ${{ steps.tag.outputs.value }}"
