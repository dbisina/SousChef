name: server

on:
  pull_request:
    paths:
      - "server/**"
      - "shared/**"
      - "docker-compose.yml"
      - ".github/workflows/server.yml"
  push:
    branches: [master, main]
    paths:
      - "server/**"
      - "shared/**"

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: souschef
          POSTGRES_PASSWORD: souschef
          POSTGRES_DB: souschef_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U souschef -d souschef_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://souschef:souschef@localhost:5432/souschef_test
      DATABASE_URL_TEST: postgresql://souschef:souschef@localhost:5432/souschef_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/native

      - name: Rust unit tests
        run: npm run native:test

      - name: Build the Rust addon
        run: npm run native:build

      - run: npm ci

      - name: Generate the database client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (real PostgreSQL)
        run: npm test

      - name: Build
        run: npm run build

  image:
    # The production image must build too: it is a different path from the dev tools above.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
